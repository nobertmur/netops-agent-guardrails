[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-agent-guardrails"
version = "0.1.0"
description = "A network-operations agent where every proposed action passes a policy gate, human approval and a tamper-evident audit log"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
netops-agent = "netops_agent.cli:main"

[tool.setuptools]
packages = ["netops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
